<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adel Saeed Abdullah</title>
    <link rel="alternate" hreflang="en" href="/en" />
    <link rel="alternate" hreflang="ar" href="/ar" />
    <!-- Static build only: picks the visitor's language (saved choice, else browser language). -->
    <script>
      (function () {
        var m = document.cookie.match(/(?:^|; )lang=(en|ar)/);
        var lang = m ? m[1] : /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
        location.replace('/' + lang + location.search + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/en" /></noscript>
    <style>html{background:#0a0a0a}@media (prefers-color-scheme: light){html{background:#fff}}</style>
  </head>
  <body></body>
</html>
